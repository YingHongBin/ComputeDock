[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computedock-agent"
version = "0.1.0"
description = "Collect GPU metrics from a compute container and report them to ComputeDock."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "httpx>=0.24,<1",
    "nvidia-ml-py>=12,<14",
]

[project.scripts]
computedock-agent = "computedock_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
