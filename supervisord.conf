[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn
pidfile=/run/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
redirect_stderr=false
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:computedock-agent]
command=/usr/local/bin/run_agent_service.sh
user=computedock-agent
priority=20
autostart=true
autorestart=unexpected
exitcodes=0,2
startsecs=0
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
redirect_stderr=false
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
