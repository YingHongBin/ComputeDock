x-monitoring-build: &monitoring-build
  build:
    context: .
    dockerfile: Dockerfile

services:
  database:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-computedock_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-computedock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=${POSTGRES_DB:-computedock_monitor}
      - -c
      - pg_partman_bgw.role=${POSTGRES_USER:-computedock}
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - timezone=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-computedock} -d ${POSTGRES_DB:-computedock_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - monitoring-postgres:/var/lib/postgresql
    restart: unless-stopped

  collector:
    <<: *monitoring-build
    image: computedock-monitor-collector:${MONITORING_IMAGE_TAG:-local}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn computedock_monitor.collector:app --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips='*'
    ports:
      - "${COLLECTOR_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    <<: *monitoring-build
    image: computedock-monitor-app:${MONITORING_IMAGE_TAG:-local}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      collector:
        condition: service_healthy
    command:
      - uvicorn
      - computedock_monitor.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "${MONITORING_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    <<: *monitoring-build
    image: computedock-monitor-worker:${MONITORING_IMAGE_TAG:-local}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-60}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-5}
    depends_on:
      collector:
        condition: service_healthy
    command:
      - python
      - -m
      - computedock_monitor.worker
    restart: unless-stopped

volumes:
  monitoring-postgres:
